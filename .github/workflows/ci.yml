name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # In production, pin third-party actions to a full commit SHA instead of a tag.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m secure_ai.dev_checks.cli .
      - run: python -m pytest -q
      - run: python run_redteam.py
      # Recommended addition: pip-audit against your real dependency tree.
