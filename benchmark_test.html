"<!doctype html>\n<html><head><meta charset=\"utf-8\"><title>Benchmark Dashboard</title>\n<style>\n  body { font-family: system-ui, sans-serif; max-width: 900px;\n         margin: 2em auto; padding: 0 1em; color: #222; }\n  h1, h2 { color: #0a3d62; }\n  table { border-collapse: collapse; margin: 1em 0; }\n  th, td { border: 1px solid #ccc; padding: 6px 12px; text-align: left; }\n  th { background: #f0f4f8; }\n  code { background: #f0f0f0; padding: 2px 4px; border-radius: 3px; }\n  a { color: #1a73e8; text-decoration: none; }\n  a:hover { text-decoration: underline; }\n</style></head>\n<body>\n<h1>Benchmark Dashboard</h1>\n<p><a href=\"/\">&larr; Back to chat demo</a></p>\n<p>\n  <label>Run:\n    <select id=\"run-select\" onchange=\"loadRun(this.value)\">\n      <option value=\"20261024T162110Z\">20261024T162110Z</option>\n    </select>\n  </label>\n</p>\n<div id=\"content\">Loading...</div>\n<script>\nasync function loadRun(runId) {\n  const resp = await fetch(`/api/benchmark/run/${runId}`);\n  if (!resp.ok) {\n    document.getElementById('content').textContent = 'Failed: ' + resp.status;\n    return;\n  }\n  render(await resp.json());\n}\nfunction pct(x) {\n  return x === null || x === undefined ? 'n/a' : (x * 100).toFixed(2) + '%';\n}\nfunction metricsTable(m) {\n  const lat = m.latency;\n  const latStr = lat\n    ? `n=${lat.n}, mean=${(lat.mean_s*1000).toFixed(1)}ms, p95=${(lat.p95_s*1000).toFixed(1)}ms`\n    : 'n/a';\n  return `<table>\n    <tr><th>Metric</th><th>Value</th></tr>\n    <tr><td>ASR</td><td>${pct(m.asr)}</td></tr>\n    <tr><td>Block Rate</td><td>${pct(m.block_rate)}</td></tr>\n    <tr><td>FPR</td><td>${pct(m.false_positive_rate)}</td></tr>\n    <tr><td>Leakage Rate</td><td>${pct(m.unauthorized_data_leakage_rate)}</td></tr>\n    <tr><td>Authz Accuracy</td><td>${pct(m.authorization_accuracy)}</td></tr>\n    <tr><td>Latency</td><td>${latStr}</td></tr>\n  </table>`;\n}\nfunction render(data) {\n  const t = data.targets || {};\n  let html = `<p><small>Run: <code>${data.run_id}</code></small></p>`;\n  if (t.secure) html += `<h2>Secure Gateway</h2>` + metricsTable(t.secure.metrics);\n  if (t.baseline) html += `<h2>Insecure Baseline</h2>` + metricsTable(t.baseline.metrics);\n  if (data.comparison) {\n    html += `<h2>Comparison</h2><table><tr><th>Metric</th><th>Delta</th></tr>`;\n    for (const [k, v] of Object.entries(data.comparison)) {\n      html += `<tr><td>${k}</td><td>${v === null ? 'n/a' : (v >= 0 ? '+' : '') + v.toFixed(4)}</td></tr>`;\n    }\n    html += `</table>`;\n  }\n  document.getElementById('content').innerHTML = html;\n}\nloadRun(\"20261024T162110Z\");\n</script>\n</body></html>"
